[package]
name = "morphiecore-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Execution runtime, trusted HTTP transport, credentials, accounts and configuration for MorphieCore"

[features]
test-hooks = ["morphiecore-protocol/test-hooks"]

[dependencies]
morphiecore-semantic.workspace = true
morphiecore-lowering.workspace = true
morphiecore-protocol.workspace = true
morphiecore-catalog.workspace = true

atomicwrites.workspace = true
base64.workspace = true
bytes.workspace = true
fs-mistrust.workspace = true
futures-util.workspace = true
getrandom.workspace = true
httparse.workspace = true
hyper.workspace = true
jsonwebtoken.workspace = true
oauth2.workspace = true
reqwest.workspace = true
rustls.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-permissions.workspace = true

[dev-dependencies]
morphiecore-protocol = { workspace = true, features = ["test-hooks"] }
morphiecore-test-support.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
