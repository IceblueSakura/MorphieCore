# Include this file from an existing http {} context, not from server {}.
# Replace the domain/certificate paths and review limits before deployment.
# See docs/usage.md#reverse-proxy-deployment. No credentials belong in this file.

upstream morphiecore {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Example pre-authentication resource limits, not per-Agent authorization.
# Adjust per-IP limits when several Agents share a NAT.
limit_conn_zone $binary_remote_addr zone=morphiecore_per_ip:1m;
limit_conn_zone $server_name zone=morphiecore_total:1m;

# Deliberately omit credentials, bodies, URLs, IPs and session identifiers.
log_format morphiecore_delivery escape=json
    '{"status":$status,"protocol":"$server_protocol",'
    '"encoding":"$sent_http_content_encoding","gzip_ratio":"$gzip_ratio",'
    '"request_bytes":$request_length,"body_bytes":$body_bytes_sent,'
    '"request_seconds":$request_time,"upstream_seconds":"$upstream_response_time"}';

server {
    listen 443 ssl;
    server_name morphiecore.example.invalid;
    ssl_certificate /etc/nginx/tls/morphiecore.crt;
    ssl_certificate_key /etc/nginx/tls/morphiecore.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_early_data off;

    # Requires ngx_http_v2_module and Nginx >= 1.25.1; HTTP/1.1 remains available.
    # This does not make a client with HTTP/2 disabled negotiate HTTP/2.
    http2 on;
    # Optional only after verifying the build, client support and UDP reachability:
    # listen 443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;

    access_log /var/log/nginx/morphiecore-access.log morphiecore_delivery;
    # Protect inherited error logs; they may contain URLs. Never enable debug
    # logging for production credentials or payloads.

    underscores_in_headers on;
    client_max_body_size 32m;
    client_header_timeout 15s;
    client_body_timeout 120s;
    send_timeout 300s;
    keepalive_timeout 75s;
    limit_conn_status 429;
    limit_conn morphiecore_per_ip 16;
    limit_conn morphiecore_total 32;

    # Create a service-owned private directory on space-bounded storage.
    # Buffered uploads can reach disk before MorphieCore authenticates them.
    client_body_temp_path /var/lib/nginx/morphiecore-client-body 1 2;

    gzip on;
    gzip_comp_level 1;
    gzip_min_length 1024;
    gzip_types application/json text/event-stream;
    gzip_vary on;
    gzip_proxied any;

    location /v1/ {
        proxy_pass http://morphiecore;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        # Preserve original Authorization/x-api-key, version and session headers.
        # Never replace them with a shared upstream key or forwarded Agent ID.

        proxy_request_buffering on;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_ignore_client_abort off;
        proxy_store off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
