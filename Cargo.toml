[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
morphiecore-semantic = { path = "crates/morphiecore-semantic" }
morphiecore-lowering = { path = "crates/morphiecore-lowering" }
morphiecore-protocol = { path = "crates/morphiecore-protocol" }
morphiecore-catalog = { path = "crates/morphiecore-catalog" }
morphiecore-runtime = { path = "crates/morphiecore-runtime" }
morphiecore-gateway = { path = "crates/morphiecore-gateway" }
morphiecore-test-support = { path = "crates/morphiecore-test-support" }
morphiecore-test-harness = { path = "crates/morphiecore-test-harness" }

axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
httpdate = "=1.0.3"
hyper = { version = "=1.12.0", default-features = false }
rustls = { version = "=0.23.46", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["stream", "rustls"] }
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"], default-features = false }
bytes = "=1.12.1"
base64 = "=0.23.1"
url = "=2.5.8"
mime = "=0.3.17"
multer = { version = "=3.1.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "=0.11.1"
thiserror = "=2.0.21"
strum = { version = "=0.28.0", features = ["derive"] }
fs-mistrust = { version = "=0.16.0", default-features = false }
atomicwrites = "=0.4.4"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage"] }
serde_with = { version = "=3.24.0", default-features = false, features = ["std"] }
secrecy = "=0.10.3"
zeroize = "=1.9.1"
oauth2 = { version = "=5.0.0", default-features = false }
tokio-util = { version = "=0.7.20", default-features = false, features = ["rt"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
httparse = "=1.10.1"
unicode-general-category = "=1.1.0"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "registry", "fmt"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
opentelemetry-appender-tracing = { version = "=0.33.1", default-features = false }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["logs", "trace", "internal-logs"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["logs", "trace", "http-json", "reqwest-blocking-client"] }
xxhash-rust = { version = "=0.8.19", default-features = false, features = ["xxh3"] }
windows-permissions = "=0.2.4"
libc = "=0.2.191"
aws-lc-rs = "=1.19.0"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }

[package]
name = "morphiecore"
version.workspace = true
edition.workspace = true
description = "Experimental routing gateway for a distributed Agent Runtime"
license.workspace = true

[dependencies]
morphiecore-semantic.workspace = true
morphiecore-lowering.workspace = true
morphiecore-protocol.workspace = true
morphiecore-catalog.workspace = true
morphiecore-runtime.workspace = true
morphiecore-gateway.workspace = true

axum.workspace = true
bytes.workspace = true
clap.workspace = true
mime.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[dev-dependencies]
morphiecore-gateway = { workspace = true, features = ["test-hooks"] }
morphiecore-runtime = { workspace = true, features = ["test-hooks"] }
morphiecore-test-harness.workspace = true
morphiecore-test-support.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
futures-util.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
proptest.workspace = true
tempfile.workspace = true
reqwest = { workspace = true, features = ["json"] }
tower.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "test-util"] }
